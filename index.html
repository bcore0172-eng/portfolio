<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corey Bates Jr Photography</title>
    <link rel="stylesheet" href="styles.css">

    <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
<script>
    (function(){
    emailjs.init('Nor7E6NohTvLJoILN');
    })();
</script>

</head>

<body>
    <div class="app">
<header class="top-banner">
    <h1>Corey Bates Jr</h1>
    <p>Automotive Photography</p>
</header>
    <nav>
        <a href="#gallery">Gallery</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <section id="gallery">
    <h3>Gallery</h3>

    <div class="gallery-grid">
    <img src="images/Buggati Chiron.jpg" data-full="images/Buggati Chiron.jpg" loading="lazy" alt="A Bugatti at Cars and Coffee">
    <img src="images/F82 BMW M4 Front End Shot.jpg" data-full="images/F82 BMW M4 Front End Shot.jpg" loading="lazy" alt="F82 M4 in Japan Front End">
    <img src="images/F82 BMW M4 Quarter Shot.jpg" data-full="images/F82 BMW M4 Quarter Shot.jpg" loading="lazy" alt="F82 M4 in Japan Headlight Shot">
    <img src="images/Ferrari Interior Shot.jpg" data-full="images/Ferrari Interior Shot.jpg" loading="lazy" alt="Ferrari interior at Cars and Coffee">
    <img src="images/Ferrari Wheel Shot.jpg" data-full="images/Ferrari Wheel Shot.jpg" loading="lazy" alt="Ferrari Wheel shot at Cars and Coffee">
    <img src="images/GTR Front.jpg" data-full="images/GTR Front.jpg" loading="lazy" alt="Nismo GTR Front end in Japan">
    <img src="images/GTR Rear Quarter.jpg" data-full="images/GTR Rear Quarter.jpg" loading="lazy" alt="Nismo GTR rear quarter in Japan">
    <img src="images/Nissan 370z.jpg" data-full="images/Nissan 370z.jpg" loading="lazy" alt="370z at Cars and Coffee">
    <img src="images/G82 711 Shot.png" data-full="images/G82 711 Shot.png" loading="lazy" alt="G82 M4 at 7/11">

    </div>
    </section>

    <section id="about">
    <h3>About</h3>
        <p>Specializing in high-end automotive photography that highlights design, engineering, and emotion.</p>
    </section>

    <section id="contact">
    <h3>Contact</h3>
    
    <form id="contact-form" class="contact-form">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" placeholder="Your name" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Your email" required>

    <label for="message">Message:</label>
    <textarea id="message" name="message" placeholder="DM me on Instagram for inquiries" required></textarea>

    <button type="submit" required>Send</button>
    </form>

<div class="social-links">
    <p>Or DM me on Instagram for inquiries:</p>
    <a href="https://www.instagram.com/cmbjphotos/" target="_blank">@cmbjphotos</a>
    <a href="https://www.linkedin.com/in/corey-bates-jr-97433a328/" target="_blank">LinkedIn</a>
</div>
</section>

</div>

    <!-- Lightbox -->
    <div id="lightbox">
    <span class="arrow left">&#10094;</span>
    <img id="lightbox-img" src="" alt="Expanded photo">
    <p id="lightbox-caption"></p>
    <span class="arrow right">&#10095;</span>
</div>

<script src="script.js"></script>

</body>
</html>
