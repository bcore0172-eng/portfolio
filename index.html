<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corey Bates Jr Photography</title>
    <link rel="stylesheet" href="styles.css">

    <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
<script>
    (function(){
    emailjs.init('Nor7E6NohTvLJoILN');
    })();
</script>

</head>

<body>
    <div class="app">
<header class="top-banner">
    <h1>Corey Bates Jr</h1>
    <h2 class="tagline">Automotive Photography</h2>
</header>
    <nav>
        <a href="#gallery">Gallery</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <section id="gallery">
    <h3>Gallery</h3>

    <div class="gallery-grid">
    <img src="images/images/AisleWalking.jpg" data-full="images/images/AisleWalking.jpg" loading="lazy" alt="aisle walking">
    <img src="images/images/BrideandCousin.jpg" data-full="images/images/BrideandCousin.jpg" loading="lazy" alt="bride and cousin">
    <img src="images/images/Danielle1.png" data-full="images/images/Danielle1.png" loading="lazy" alt="Danielle 1">
    <img src="images/images/Danielle2.png" data-full="images/images/Danielle2.png" loading="lazy" alt="Danielle 2">
    <img src="images/images/Groom&Bride'sSister.jpg" data-full="images/images/Groom&Bride'sSister.jpg" loading="lazy" alt="Groom and bride sister">
    <img src="images/images/Kalli1.jpg" data-full="images/images/Kalli1.jpg" loading="lazy" alt="Kalli 1">
    <img src="images/images/Kalli2.jpg" data-full="images/images/Kalli2.jpg" loading="lazy" alt="Kalli 2">
    <img src="images/images/Kalli3Snow.jpg" data-full="images/images/Kalli3Snow.jpg" loading="lazy" alt="Kalli Snow">
    <img src="images/images/Kalli4Dinner.jpg" data-full="images/images/Kalli4Dinner.jpg" loading="lazy" alt="Kalli Dinner">

    </div>
    </section>

    <section id="about">
    <h3>About</h3>
        <p>Specializing in high-end automotive photography that highlights design, engineering, and emotion.</p>
    </section>

    <section id="contact">
    <h3>Contact</h3>
    
    <form id="contact-form" class="contact-form">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" placeholder="Your name" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Your email" required>

    <label for="message">Message:</label>
    <textarea id="message" name="message" placeholder="DM me on Instagram for inquiries" required></textarea>

    <button type="submit" required>Send</button>
    </form>

<div class="social-links">
    <p>Or DM me on Instagram for inquiries:</p>
    <a href="https://www.instagram.com/cmbjphotos/" target="_blank">@cmbjphotos</a>
    <a href="https://www.linkedin.com/in/corey-bates-jr-97433a328/" target="_blank">LinkedIn</a>
</div>
</section>

</div>

    <!-- Lightbox -->
    <div id="lightbox">
    <span class="arrow left">&#10094;</span>
    <img id="lightbox-img" src="" alt="Expanded photo">
    <p id="lightbox-caption"></p>
    <span class="arrow right">&#10095;</span>
</div>

<script src="script.js"></script>

</body>
</html>
